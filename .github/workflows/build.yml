name: Android library and API 24 regressions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Verify Android 7 compatibility, release packaging, and style
        run: |
          chmod +x gradlew
          ./gradlew :lib:verifyAndroid7Compatibility :lib:ktlintCheck --no-daemon
      - name: Build optional Android device demo
        run: ./gradlew -PincludeSample=true :sample:assembleDebug --no-daemon
